services:
  backend:
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["npm", "run", "start:dev"]
    ports:
      - "3001:3001"
    env_file: .env # ← ここを追加する（絶対必要）
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3001} # こう書けば.envがないときも安全
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app_network

  database:
    image: postgres:14
    restart: always
    env_file: .env # ← ここも追加する（DBコンテナ側にも必要）
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
